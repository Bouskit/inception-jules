<!DOCTYPE html>
<html lang="en">
<head>

    <title>Showcase</title>
    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>Inception: the easiest project</h1>
    </header>

        <main class="gallery">
        <figure>
            <img src="images/happy.jpeg" alt="Big confident smile">
            <figcaption>
                Me adding <code>"DevOps Engineer"</code> to my LinkedIn after curl said <code>200 OK</code>.
            </figcaption>
        </figure>

        <figure>
            <img src="images/grumpy.jpeg" alt="Dark, very unamused face">
            <figcaption>
                Me reading <code>File not found</code> on Firefox for 2 hours
            </figcaption>
        </figure>

        <figure>
            <img src="images/mask.jpeg" alt="Smiling mask held over an unamused face">

                Me during the defense: "Yes, of course I understand every line."<br>
                The line: <code>openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem -subj</code>
            </figcaption>
        </figure>

    <footer>
        <p>bboukach · 42 Luxembourg</p>
